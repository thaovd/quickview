<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Decorative Circle Rings -->
  <circle cx="400" cy="300" r="220" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,8" opacity="0.6" />
  <circle cx="400" cy="300" r="160" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.5" />
  <circle cx="400" cy="300" r="100" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,6" opacity="0.4" />

  <!-- Center Card Shape -->
  <g filter="url(#shadow)">
    <rect x="220" y="160" width="360" height="280" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.95" />
  </g>

  <!-- Glowing Star / Gem in Center -->
  <polygon points="400,195 418,245 470,245 428,275 444,325 400,295 356,325 372,275 330,245 382,245" fill="url(#goldGrad)" />

  <!-- Main Headline -->
  <text x="400" y="365" font-family="Segoe UI, sans-serif" font-size="24" font-weight="bold" fill="url(#accentGrad)" text-anchor="middle">
    QuickView Direct2D SVG
  </text>

  <!-- Subtitle -->
  <text x="400" y="395" font-family="Segoe UI, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    Native Windows Vector Engine (ID2D1DeviceContext5)
  </text>

  <text x="400" y="420" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    Infinite zoom without pixelation • Crisp vector curves
  </text>

  <!-- Corner badges -->
  <rect x="40" y="40" width="110" height="32" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="95" y="61" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">SVG 1.1</text>

  <rect x="650" y="40" width="110" height="32" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="705" y="61" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#a855f7" text-anchor="middle">VECTOR</text>
</svg>
